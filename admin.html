  <div class="login-container">
    <h2>Admin Portal</h2>
    <p class="subtitle">Diamond Control Pannel</p>
    
    <button id="googleLoginBtn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign in with Google
    </button>
    
    <div class="error-msg" id="errorBlock"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBvS4HJ07d7Umyb89dCsn2bLALvcqnpoSs",
      authDomain: "diamond-c21dc.firebaseapp.com",
      projectId: "diamond-c21dc",
      storageBucket: "diamond-c21dc.firebasestorage.app",
      messagingSenderId: "1035207428852",
      appId: "1:1035207428852:web:ce2faa86d058b75a56eca1",
      measurementId: "G-RX40Y0EYW3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    
    // Optional: Forces the prompt to select an account even if one is already signed into the browser
    provider.setCustomParameters({ prompt: 'select_account' });

    const loginBtn = document.getElementById('googleLoginBtn');
    const errorBlock = document.getElementById('errorBlock');
    const allowedAdmin = "adityasonihyderabad@gmail.com";

    loginBtn.addEventListener('click', async () => {
      errorBlock.style.display = 'none';
      
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        if (user.email === allowedAdmin) {
          window.location.href = "upload.html";
        } else {
          // Immediately sign out unauthorized users
          await signOut(auth);
          errorBlock.textContent = "Access Denied: You are not authorized to view the admin console.";
          errorBlock.style.display = 'block';
        }
      } catch (error) {
        errorBlock.textContent = error.message.replace("Firebase: ", "");
        errorBlock.style.display = 'block';
      }
    });
  </script>
